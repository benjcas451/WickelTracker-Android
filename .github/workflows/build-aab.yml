name: Android App Bundle (Release)

on:
  workflow_dispatch:
    inputs:
      play_upload:
        description: "Bundles zusätzlich in die Play-Tracks hochladen (alpha / wear:Alpha)"
        type: boolean
        default: true

jobs:
  build-aab:
    name: Signiertes AAB bauen und als Release veröffentlichen
    runs-on: ubuntu-latest
    # GITHUB_TOKEN braucht Schreibrechte, um Tag + Release anzulegen.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Start-JDK für den Gradle-Launcher; den eigentlichen Daemon-JDK (25)
      # provisioniert Gradle selbst über gradle/gradle-daemon-jvm.properties
      # (Foojay-Toolchain-Resolver).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Upload-Keystore + key.properties aus Secrets wiederherstellen –
      # gleiche Secrets-Namen wie im Flutter-Repo (dort einmalig ins neue
      # Repo kopieren). storeFile liegt relativ zum Projekt-Root, so löst
      # app/build.gradle.kts den Pfad auf.
      - name: Keystore & key.properties bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PW: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > upload-keystore.jks
          sz=$(stat -c%s upload-keystore.jks 2>/dev/null || echo 0)
          if [ "$sz" -lt 100 ]; then
            echo "::error::PLAY_KEYSTORE_BASE64 ergibt nur $sz Bytes – Secret fehlt oder ist kein gültiges Base64."
            exit 1
          fi
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF

      # versionCode = 100 + run_number (Handy) bzw. + 1000 Versatz (Uhr):
      # bleibt strikt monoton und liegt sicher über den bereits im Play Store
      # verwendeten Codes der Flutter-App (dort war versionCode = run_number,
      # zuletzt <= 10). APKs fürs GitHub-Release, Bundles nur für Play.
      - name: Signierte APKs bauen (Handy + Wear)
        run: ./gradlew :app:assembleRelease :wear:assembleRelease -PbuildNumber=$((100 + GITHUB_RUN_NUMBER))

      - name: Signierte App-Bundles für Play bauen
        if: ${{ inputs.play_upload }}
        run: ./gradlew :app:bundleRelease :wear:bundleRelease -PbuildNumber=$((100 + GITHUB_RUN_NUMBER))

      - name: APK als GitHub-Release veröffentlichen
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/outputs/apk/release/app-release.apk
          asset_name: Wickel-v2.0.1-${{ github.run_number }}.apk
          tag: v2.0.1-${{ github.run_number }}
          overwrite: true
          body: "Wickel-Tracker v2.0.1 (Lauf ${{ github.run_number }}) – signierte APKs für Handy und Wear OS (Play-Upload erfolgt als App Bundle)"

      - name: Wear-APK an dasselbe Release anhängen
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: wear/build/outputs/apk/release/wear-release.apk
          asset_name: Wickel-Wear-v2.0.1-${{ github.run_number }}.apk
          tag: v2.0.1-${{ github.run_number }}
          overwrite: true

      # Handy- und Uhr-Bundle MÜSSEN in getrennten Schritten (= getrennten
      # Play-Edits) hochgeladen werden: Play verlangt für Wear OS einen
      # eigenen Formfaktor-Track. Track-Namen sind case-sensitiv; der
      # Handy-Closed-Testing-Track der Flutter-App hieß "alpha".
      - name: AAB in Play hochladen (alpha)
        if: ${{ inputs.play_upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.dwarftsch.wickel
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed

      # Der Wear-Formfaktor-Track muss in der Play Console einmalig angelegt
      # sein (Formfaktor Wear OS aktivieren). Schlägt der Schritt mit
      # "track not found" fehl, listet die Fehlermeldung die verfügbaren
      # Track-Namen – dann hier exakt übernehmen (bei Stillzeit: "wear:Alpha").
      - name: Wear-AAB in Play hochladen (wear:Alpha)
        if: ${{ inputs.play_upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.dwarftsch.wickel
          releaseFiles: wear/build/outputs/bundle/release/wear-release.aab
          tracks: "wear:Alpha"
          status: completed

      - name: Keystore aufräumen
        if: always()
        run: rm -f upload-keystore.jks key.properties
